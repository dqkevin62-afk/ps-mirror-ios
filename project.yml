name: PSMirror
options:
  bundleIdPrefix: com.dqkevin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"

targets:
  PSMirror:
    type: application
    platform: iOS
    sources:
      - path: PSMirror
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dqkevin.psmirror
        PRODUCT_NAME: PSMirror
        INFOPLIST_FILE: PSMirror/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

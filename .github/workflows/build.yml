name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild \
            -project PSMirror.xcodeproj \
            -scheme PSMirror \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          if [ -z "$APP" ]; then echo "未找到 .app，构建失败"; exit 1; fi
          rm -rf Payload PSMirror-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PSMirror-unsigned.ipa Payload
          ls -lh PSMirror-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSMirror-unsigned-ipa
          path: PSMirror-unsigned.ipa
          if-no-files-found: error
